<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Business Assistant Demo | KJ Tech Solutions</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:radial-gradient(circle at 30% 0,#0e3a4d,#050816 60%) fixed;color:#e8ecff;min-height:100vh;display:grid;place-items:center;padding:16px}
.wrap{width:min(460px,100%)}.top{font-size:.85rem;color:#9aa6c7;margin-bottom:12px}.top a{color:#10d9c4;text-decoration:none}
.chat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:22px;backdrop-filter:blur(14px);overflow:hidden;display:flex;flex-direction:column;height:min(600px,80vh)}
.hd{padding:16px 20px;background:rgba(255,255,255,.05);font-weight:700;display:flex;align-items:center;gap:10px}.hd i{width:10px;height:10px;border-radius:50%;background:#4ade80}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:80%;padding:10px 14px;border-radius:16px;font-size:.95rem;animation:in .3s}.bot{background:#1e2a63;align-self:flex-start}.me{background:linear-gradient(135deg,#10d9c4,#2f6bff);align-self:flex-end}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.q{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 10px}.q button{background:transparent;border:1px solid rgba(255,255,255,.2);color:#cfe;border-radius:50px;padding:6px 14px;cursor:pointer;font-size:.85rem}.q button:hover{border-color:#10d9c4}
form{display:flex;gap:8px;padding:12px;border-top:1px solid rgba(255,255,255,.12)}
input{flex:1;padding:12px 16px;border-radius:50px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.3);color:#fff;font:inherit}
form button{padding:0 20px;border:0;border-radius:50px;background:linear-gradient(135deg,#10d9c4,#2f6bff);color:#fff;font-weight:700;cursor:pointer}
</style></head><body><div class="wrap">
<div class="top">Concept demo by KJ Tech Solutions. Scripted answers for a sample shop. <a href="../index.html#portfolio">&larr; Back</a></div>
<div class="chat"><div class="hd"><i></i>Demo Store Assistant</div><div id="log"></div>
<div class="q" id="q"><button>Opening hours</button><button>Delivery</button><button>Prices</button><button>Talk to a human</button></div>
<form id="f"><input id="t" placeholder="Type a message..." autocomplete="off"><button>Send</button></form></div></div>
<script>
const log=document.getElementById('log'),t=document.getElementById('t');
const answers=[
 [/hour|open|time|timing/,'We are open 10 AM to 8 PM, Monday to Saturday (sample hours).'],
 [/deliver|ship/,'Yes, we deliver in the local area. Tell me your area and I can check.'],
 [/price|cost|rate|charge/,'Prices start from a few hundred rupees (sample). Which product are you interested in?'],
 [/human|person|call|owner/,'Sure! Please leave your name and number and the owner will contact you.'],
 [/hi|hello|hey|namaste/,'Hello! I am the demo assistant. Ask me about hours, delivery or prices.']];
function add(txt,who){const d=document.createElement('div');d.className='m '+who;d.textContent=txt;log.appendChild(d);log.scrollTop=log.scrollHeight}
function ask(v){v=v.trim();if(!v)return;add(v,'me');const l=v.toLowerCase();
 const a=(answers.find(r=>r[0].test(l))||[0,'I am only a demo, so I can answer questions about hours, delivery and prices.'])[1];
 setTimeout(()=>add(a,'bot'),600)}
document.getElementById('f').onsubmit=e=>{e.preventDefault();ask(t.value);t.value=''};
document.querySelectorAll('#q button').forEach(b=>b.onclick=()=>ask(b.textContent));
add('Hi! I am the Demo Store assistant. How can I help you today?','bot');
</script></body></html>

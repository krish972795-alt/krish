<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Promo Video Demo | KJ Tech Solutions</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#050816;color:#e8ecff;min-height:100vh;display:grid;place-items:center;padding:20px}
.wrap{width:min(860px,100%)}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.85rem;color:#9aa6c7;margin-bottom:14px}.top a{color:#27a2ff;text-decoration:none}
.stage{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;box-shadow:0 30px 80px rgba(39,162,255,.25)}
.s{position:absolute;inset:0;display:grid;place-items:center;text-align:center;opacity:0;animation:sc 12s infinite;padding:20px}
.s h2{font:800 clamp(1.8rem,7vw,4.2rem)/1.05 'Segoe UI',sans-serif;letter-spacing:-.02em}.s p{font-size:clamp(.9rem,2.4vw,1.4rem);opacity:.9;margin-top:10px}
.s1{background:linear-gradient(135deg,#8b5cf6,#f43f8e);animation-delay:0s}
.s2{background:linear-gradient(135deg,#27a2ff,#1b1f6b);animation-delay:3s}
.s3{background:linear-gradient(135deg,#10d9c4,#2f6bff);animation-delay:6s}
.s4{background:linear-gradient(135deg,#ff7a45,#f43f8e);animation-delay:9s}
.s3 .row{font-size:clamp(2.4rem,10vw,5rem);display:flex;gap:18px;justify-content:center}
@keyframes sc{0%{opacity:0;transform:scale(1.18)}4%,22%{opacity:1;transform:scale(1)}25%,100%{opacity:0}}
.tl{margin-top:16px;background:#141a45;border-radius:12px;padding:12px;display:flex;align-items:center;gap:14px}
.tl button{background:linear-gradient(135deg,#27a2ff,#8b5cf6);color:#fff;border:0;border-radius:50%;width:40px;height:40px;cursor:pointer;font-size:1rem}
.track{flex:1;height:12px;border-radius:6px;background:linear-gradient(90deg,#8b5cf6 25%,#27a2ff 25% 50%,#10d9c4 50% 75%,#ff7a45 75%);position:relative}
.track i{position:absolute;top:-5px;left:0;width:3px;height:22px;background:#fff;animation:pg 12s linear infinite}
@keyframes pg{to{left:100%}}
.paused *{animation-play-state:paused!important}
</style></head><body><div class="wrap">
<div class="top"><span>Concept motion promo by KJ Tech Solutions. Made with CSS, no video file.</span><a href="../index.html#portfolio">&larr; Back to KJ Tech Solutions</a></div>
<div class="stage" id="st">
<div class="s s1"><div><h2>SUMMER SALE</h2><p>Fresh looks. Fresh prices.</p></div></div>
<div class="s s2"><div><h2>UP TO 50% OFF</h2><p>This weekend only</p></div></div>
<div class="s s3"><div><div class="row"><span>👕</span><span>👟</span><span>🕶️</span></div><p>New arrivals in store</p></div></div>
<div class="s s4"><div><h2>SHOP NOW</h2><p>Sample brand. Concept demo.</p></div></div>
</div>
<div class="tl" id="tl"><button id="b" aria-label="Pause or play">&#10074;&#10074;</button><div class="track"><i></i></div></div>
</div><script>
const t=document.getElementById('tl'),b=document.getElementById('b'),w=document.querySelector('.wrap');
b.onclick=()=>{const p=w.classList.toggle('paused');b.innerHTML=p?'&#9654;':'&#10074;&#10074;'};
</script></body></html>
